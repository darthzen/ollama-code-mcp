apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama-code-mcp
  labels:
    app.kubernetes.io/name: ollama-code-mcp
  annotations:
    # cert-manager provisions the TLS secret via the DNS-01 ClusterIssuer in
    # k8s/cert-manager-issuer.yaml (apply that once, after installing
    # cert-manager and creating its cloudflare-api-token secret).
    cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  tls:
    - hosts: [mcp-ollama.ash4d.com]
      secretName: mcp-ollama-ash4d-tls
  rules:
    - host: mcp-ollama.ash4d.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: ollama-code-mcp
                port:
                  number: 8765
