apiVersion: v1
kind: Service
metadata:
  name: ollama-code-mcp
  labels:
    app.kubernetes.io/name: ollama-code-mcp
spec:
  # ClusterIP by default -- Claude Code running on the same LAN can reach
  # this via `kubectl port-forward`, or switch this to LoadBalancer (as the
  # ollama-current-values.yaml setup does for Ollama itself) to expose it
  # directly on the LAN.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama-code-mcp
  ports:
    - name: mcp
      port: 8765
      targetPort: mcp
