apiVersion: v1
kind: Service
metadata:
  name: ollama-code-mcp
  labels:
    app.kubernetes.io/name: ollama-code-mcp
spec:
  # ClusterIP -- external access goes through ingress.yaml
  # (https://mcp-ollama.ash4d.com/mcp), since Claude's custom-connector UI
  # requires an https URL. `kubectl port-forward` remains an option for
  # ad-hoc local testing.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ollama-code-mcp
  ports:
    - name: mcp
      port: 8765
      targetPort: mcp
